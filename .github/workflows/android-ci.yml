name: Sentinel vNext Android & Rust Core CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - 'core-engine/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  pull_request:
    branches: [ main ]

jobs:
  build-rust-native-core:
    name: Compile Rust Native FFI Targets (Android NDK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache Cargo Registry & Build Objects
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core-engine/target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Android Shared Libraries (.so)
        run: |
          cd core-engine
          cargo ndk -t arm64-v8a -t x86_64 -o ../app/src/main/jniLibs build --release

  build-android-apk:
    name: Build Android APK
    needs: build-rust-native-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Grant Gradle Executable Permission
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace
